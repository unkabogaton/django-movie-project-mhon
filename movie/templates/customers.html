{% extends "base.html" %}
{% block content %}
<div style="padding: 24px;">
  <h1 class="page-title">Customers</h1>

  <form method="get" class="form-filters">
    <input type="text" name="q" placeholder="Search by name or email" value="{{ search_query }}"
           class="input-field" style="flex: 1; max-width: 300px;" />
    <button type="submit" class="btn-primary">Search</button>
  </form>
<div class="recent-transactions">
  <table>
    <thead>
      <tr class="table-header">
        <th class="table-cell">Name</th>
        <th class="table-cell">Email</th>
        <th class="table-cell">Telephone</th>
        <th class="table-cell">Created At</th>
      </tr>
    </thead>
    <tbody>
      {% for customer in customers %}
        <tr>
          <td class="table-cell">{{ customer.name }}</td>
          <td class="table-cell">{{ customer.email }}</td>
          <td class="table-cell">{{ customer.telephone_number }}</td>
          <td class="table-cell">{{ customer.createdAt|date:"Y-m-d H:i" }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4" class="table-cell" style="text-align: center;">No customers found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</div>
{% endblock %}
